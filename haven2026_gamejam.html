<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title></title>
<style>
:root {
	--borders: #fff;
	--bg: #000;
	--blood: #f00;
	--currentblood: 100%;
	--newblood: 100%;
	--playerx: 0px;
	--playery: 0px;
	--dirx: 0px;
	--diry: 0px;
	--currenteblood: 100%;
	--neweblood: 100%;
	--currentshield: 0%;
	--newshield: 0%;
}
html, body {
	background-color: var(--bg);
	height: 100%;
	overflow: hidden;
}
#game-box {
	position: absolute;
	top: calc(50% - 15em + 1px);
	left: calc(50% - 15em + 1px);
	width: calc(30em + 2px);
	height: calc(30em + 2px);
	border: 1px var(--borders) solid;
	background-color: var(--bg);
	overflow: hidden;
}
#game-title-box {
	position: absolute; 
	top: 0px;
	left: 0px;
	width: 100%;
	height: 100%;
	border: 0px var(--borders) solid;
	flex-flow: column nowrap;
	justify-content: space-around;
	align-items: center;
	font-family: monospace;
}
#game-title {
	font-size: 2em;
	color: var(--borders);
}
#game-title-start {
	border: 1px var(--borders) solid;
	font-family: monospace;
	font-size: 1.5em;
	color: var(--borders);
	background-color: var(--bg);
	padding: 0.5em;
}
#game-title-start:hover {
	background-color: var(--borders);
	color: var(--bg);
}
#blood-meter {
	border: 1px var(--borders) solid;
	position: absolute;
	top: 5%;
	left: 90%;
	width: 5%;
	height: 90%;
	background-color: var(--bg);
}
#blood-meter-num {
	position: absolute;
	top: 5%;
	left: 95%;
	width: 5%;
	height: 90%;
	font-family: monospace;
	font-size: 1em;
	text-align: center;
	color: var(--borders);
}
#blood-meter-bar {
	position: absolute;
	bottom: 0px;
	left: 0px;
	width: 100%;
	height: 0%;
	background-color: var(--blood);
}
#shield-meter-num {
	position: absolute;
	top: calc(5% - 1.5em);
	left: 90%;
	width: 5%;
	height: 1em;
	font-family: monospace;
	font-size: 1em;
	text-align: center;
	color: var(--borders);
}
#shield-meter-bar {
	position: absolute;
	top: 0px;
	left: 0px;
	width: 100%;
	height: 0%;
}
.shield {
	background-image: radial-gradient(circle, var(--borders) 25%, transparent 25%), 
	radial-gradient(circle, var(--borders) 25%, transparent 25%);
	background-color: transparent;
	background-position: 0 0, 0.3em 0.3em;
	background-size: 0.6em 0.6em;
	animation: shieldTranslateBG 1s linear infinite;
}
@keyframes shieldTranslateBG {
	0%   {background-position: 0 0, 0.3em 0.3em;}
	50%  {background-position: 0.3em 0.3em, 0.6em 0.6em;}
	100% {background-position: 0.6em 0.6em, 0.9em 0.9em;}
}
.arrows {
	
}
#game-grid {
	display: grid;
	position: absolute;
	top: 1em;
	left: 1em;
	width: 28em;
	height: 28em;
	grid-template-columns: repeat(8, 9%);
	grid-template-rows: repeat(9, 9%);
	column-gap: 0.6666em;
	row-gap: 0.6666em;
}
.grid-square {
	font-family: monospace;
	font-size: 1.5em;
	border: 2px var(--borders) solid;
	background-color: var(--bg);
	color: var(--borders);
	display: flex;
	justify-content: center;
	align-items: center;
}
.grid-none {
	opacity: 0;
}
#player {
	position: absolute;
	width: 2em;
	height: 2em;
	border-radius: 100%;
	background-color: var(--bg);
	border: 2px var(--borders) solid;
}
#battle-ui {
	position: absolute;
	width: 100%;
	height: 100%;
	top: 0px;
	left: 0px;
	transform: translate(30em, 0em);
}
#enemy1 {
	position: absolute;
	width: 10em;
	height: 10em;
	background-color: var(--bg);
	border: 2px var(--borders) solid;
	top: calc(50% - 7em);
	left: calc(50% - 5em);
}
#attack-indicator {
	position: absolute;
	top: 0.5em;
	left: 0.5em;
	border: 1px var(--borders) solid;
	font-family: monospace;
	padding: 0.5em;
	font-size: 1.5em;
	color: var(--borders);
}
.card {
	position: absolute;
	width: 7.5em;
	height: 10em;
	border: 1px var(--borders) solid;
	border-radius: 1em;
	display: flex;
	justify-content: center;
	align-items: center;
	font-family: monospace;
	top: 4em;
	background-color: var(--bg);
	color: var(--borders);
	font-size: 1.5em;
}
.inventory-card {
	width: 5em;
	height: 6.66em;
	border: 1px var(--borders) solid;
	border-radius: 0.66em;
	display: flex;
	justify-content: center;
	align-items: center;
	font-family: monospace;
	background-color: var(--bg);
	color: var(--borders);
	font-size: 1em;
	margin: 0.5em;
}
#enemy-blood-meter {
	border: 1px var(--borders) solid;
	position: absolute;
	top: 5em;
	left: 1.5em;
	width: 1.5em;
	height: calc(90% - 3.5em);
	background-color: var(--bg);
}
#enemy-blood-meter-num {
	position: absolute;
	top: 6em;
	left: 2px;
	width: 1.5em;
	height: calc(90% - 3.5em);
	font-family: monospace;
	font-size: 1em;
	text-align: center;
	color: var(--borders);
}
#enemy-blood-meter-bar {
	position: absolute;
	bottom: 0px;
	left: 0px;
	width: 100%;
	height: 0%;
	background-color: var(--borders);
}
#card-holder {
	position: absolute;
	top: 50%;
	left: 0px;
	width: 100%;
	height: 50%;
}
.card:hover {
	z-index: 100;
	border-width: 2px;
	transform: translate(0px, -2em);
}
#skip-button {
	position: absolute;
	bottom: 0.5em;
	right: 0.5em;
	font-size: 1.5em;
	padding: 0.5em;
	background-color: var(--bg);
	border: 1px var(--borders) solid;
	color: var(--borders);
	font-family: monospace;
	z-index: 101;
}
#skip-button:hover {
	background-color: var(--borders);
	color: var(--bg);
}
#inventory {
	border: 1px var(--borders) solid;
	background-color: var(--bg);
	position: absolute;
	top: calc(5% - 0.5em);
	left: calc(5% - 0.5em);
	width: 90%;
	height: calc(90% - 3em);
	padding: 0.5em;
	flex-flow: row wrap;
	overflow: auto;
	justify-content: space-around;
	align-items: flex-start;
	padding-top: 3em;
}
#inventory-button {
	border: 1px var(--borders) solid;
	background-color: var(--bg);
	position: absolute;
	bottom: 0.25em;
	left: 0.25em;
	width: 2em;
	height: 2em;
	font-size: 1.5em;
	font-family: monospace;
	color: var(--borders);
	padding: 0.25em;
	border-radius: 1em;
	display: flex;
	justify-content: center;
	align-items: center;
}
#inventory-button:hover {
	background-color: var(--borders);
	color: var(--bg);
}
#shadow {
	background-image: radial-gradient(circle, var(--bg) 40%, transparent 40%), 
	radial-gradient(circle, var(--bg) 40%, transparent 40%);
	background-color: transparent;
	background-position: 0 0, 0.3em 0.3em;
	background-size: 0.6em 0.6em;
	animation: shieldTranslateBG 2s linear infinite;
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
}
.inventory-switch {
	justify-content: center;
	align-items: center;
	background-color: var(--bg);
	color: var(--borders);
	font-size: 1.5em;
	font-family: monospace;
	position: absolute;
}
#inventory-back {
	top: 5%;
	right: 5%;
	width: 1em;
	height: 1em;
	border: 1px var(--borders) solid;
}
#inventory-showcards {
	border-color: var(--borders);
	border-width: 2px;
	width: 2em;
	height: 2em;
	top: 5%;
	left: calc(50% - 2.5em);
}
#inventory-discard {
	border-color: var(--borders);
	border-width: 2px;
	width: 2em;
	height: 2em;
	top: 5%;
	right: calc(50% - 2.5em);
}
.inventory-switch:hover {
	background-color: var(--borders);
	color: var(--bg);
}
@keyframes appear {
	from {opacity: 0;}
	to   {opacity: 1;}
}
@keyframes bloodMove {
	from {height: var(--currentblood);}
	to   {height: var(--newblood);}
}
@keyframes bloodOtherMove {
	from {height: var(--currentblood);}
	to   {height: var(--newblood);}
}
@keyframes playerMove {
	from {top: var(--playery); left: var(--playerx);}
	to   {top: var(--diry); left: var(--dirx);}
}
@keyframes playerOtherMove {
	from {top: var(--playery); left: var(--playerx);}
	to   {top: var(--diry); left: var(--dirx);}
}
@keyframes poison {
	from {border: 2px var(--borders) dotted; background-color: var(--borders); color: var(--bg);}
	to   {border: 2px var(--borders) dotted; background-color: var(--bg); color: var(--borders);}
}
@keyframes UIOut { 
	from {transform: translate(0px, 0px);}
	to   {transform: translate(-30em, 0px);}
}
@keyframes UIOut2 {
	from {transform: translate(30em, 0px);}
	to   {transform: translate(0px, 0px);}
}
@keyframes enemy1Idle {
	0%   {transform: rotate(45deg);}
	50%  {transform: rotate(495deg);}
	100% {transform: rotate(315deg);}
}
@keyframes enemyBloodMove {
	from {height: var(--currenteblood);}
	to   {height: var(--neweblood);}
}
@keyframes enemyBloodOtherMove {
	from {height: var(--currenteblood);}
	to   {height: var(--neweblood);}
}
@keyframes shieldMove {
	from {height: var(--currentshield);}
	to   {height: var(--newshield);}
}
@keyframes shieldOtherMove {
	from {height: var(--currentshield);}
	to   {height: var(--newshield);}
}
@keyframes draw {
	from {transform: translate(-60em, 0px);}
	to   {transform: translate(0em, 0px);}
}
@keyframes useCard {
	from {transform: translate(0em, -2em);}
	to   {transform: translate(0em, -50em);}
}
@keyframes shiftBack {
	from {transform: translate(0em, 0em);}
	to   {transform: translate(2em, 0em);}
}
@keyframes attackInd {
	from {left: 0.5em;}
	to   {left: calc(50% - var(--attackind));}
}
@keyframes attackIndBack {
	from {left: calc(50% - var(--attackind));}
	to   {left: 0.5em;}
}
@keyframes cardHolderBack {
	from {transform: translate(0, 0);}
	to   {transform: translate(0, 7.5em);}
}
</style>
</head>
<body>

<div id="game-box">

<div id="game-title-box" style="display: flex;">
<div id="game-title">Blood and Marrow</div>
<button type="button"id="game-title-start"onclick="beginGame()">Begin!!</button>
</div>

<div id="game-ui" style="display: none; opacity: 0;">

<div id="blood-meter"><div id="blood-meter-bar"></div>
<div class="shield" id="shield-meter-bar"></div></div>
<div id="blood-meter-num">0<br>/<br>10</div>
<div id="shield-meter-num"></div>

<div id="overworld">
<div id="game-grid"></div>
<div id="player"></div>
</div>
<div id="battle-ui">
<div id="attack-indicator"></div>
<div id="enemy-holder"></div>

<div id="enemy-blood-meter"><div id="enemy-blood-meter-bar"></div></div>
<div id="enemy-blood-meter-num">0<br>/<br>10</div>

<div id="card-holder">
<button type="button" id="skip-button">//</button>
</div>
</div>

<button id="inventory-button" type="button">🂠</button>
<div id="shadow" style="display: none;"></div>
<div id="inventory" style="display: none;"></div>
<button type="button" id="inventory-back" class="inventory-switch" style="display: none;">⨯</button>
<button type="button" id="inventory-showcards" class="inventory-switch" style="display: none; border-style: solid;">🂠</button>
<button type="button" id="inventory-discard" class="inventory-switch" style="display: none; border-style: dotted;">🗑</button>

</div>

</div>

</body>
<script>
const gameBox = document.getElementById("game-box");
const titleBox = document.getElementById("game-title-box");
const gameUI = document.getElementById("game-ui");
const r = document.querySelector(":root");
const bloodNum = document.getElementById("blood-meter-num");
const bloodBar = document.getElementById("blood-meter-bar");
const shieldNum = document.getElementById("shield-meter-num");
const shieldBar = document.getElementById("shield-meter-bar");
const enemyBloodNum = document.getElementById("enemy-blood-meter-num");
const enemyBloodBar = document.getElementById("enemy-blood-meter-bar");
const gameGrid = document.getElementById("game-grid");
const player = document.getElementById("player");
const overworld = document.getElementById("overworld");
const battleUI = document.getElementById("battle-ui");
const enemyHolder = document.getElementById("enemy-holder");
const attackInd = document.getElementById("attack-indicator");
const cardHolder = document.getElementById("card-holder");
const inventory = document.getElementById("inventory");

const enemyNames = [
	"○",
	"⍚"
]
const cardKey = [
	"○ +2",
	"○ -1▻",
	"○ +3∇",
	"",
	""
];
// -1 is skip, 0 is normal, 1 is pierce, 2 is poison, 3 is shield, 4+ is special 

var health = 0;
var max = 10;
var moves = 0;
var gamestate = 0;
var enemy = 0;
var floor = 0;
const showcards = [];
var cards = [];
const grid = [new Array(8), new Array(8), new Array(8), new Array(8), new Array(8), new Array(8), 
			  new Array(8), new Array(8), new Array(8)];
const position = [0, 0];
const deck = [];
const discard = [];
var turn = 0;
var enemyHP = 0;
var enemyMax = 0;
var playerATK = 0;
var shield = 0;
var bloodMove = [false, false];
var damage = 0;
var poison = 0;

document.addEventListener("keydown", function (event) {
	if (gamestate == 0) {
		if (event.key.length >= 7) {
			if (event.key.slice(5) == "Up") {
				updatePos(0);
			} else if (event.key.slice(5) == "Right") {
				updatePos(1);
			} else if (event.key.slice(5) == "Down") {
				updatePos(2);
			} else if (event.key.slice(5) == "Left") {
				updatePos(3);
			}
		} else {
			if (event.key == "Up") {
				updatePos(0);
			} else if (event.key == "Right") {
				updatePos(1);
			} else if (event.key == "Down") {
				updatePos(2);
			} else if (event.key == "Left") {
				updatePos(3);
			}
		}
		gridCheck();
	}
});
document.getElementById("skip-button").addEventListener("click", function () {
	if (turn % 1 == 0) {
		turn += 0.25;
		playerATK = -1;
		cardHolder.style.animation = "cardHolderBack 1s both";
		setTimeout(playerTurn, 1000);
	}
});
document.getElementById("inventory-button").addEventListener("click", function () {
	document.getElementById("shadow").style.display = "";
	document.getElementById("inventory-back").style.display = "flex";
	inventory.style.display = "flex";
	if (gamestate == 1) {
		document.getElementById("inventory-showcards").style.display = "flex";
		document.getElementById("inventory-discard").style.display = "flex";
		if (document.getElementById("inventory-showcards").style["border-style"] == "solid") {
			for (i = 0; i < showcards.length; i++) {
				inventory.innerHTML += '<button type="button" class="inventory-card">' + 
				moveToString(showcards[i]) + '</button>';
			} 
		} else {
			for (i = 0; i < discard.length; i++) {
				inventory.innerHTML += '<button type="button" class="inventory-card">' + 
				moveToString(discard[i]) + '</button>';
			} 
		}
	} else {
		for (i = 0; i < showcards.length; i++) {
			inventory.innerHTML += '<button type="button" class="inventory-card">' + 
			moveToString(showcards[i]) + '</button>';
		}
	}
});
document.getElementById("inventory-showcards").addEventListener("click", function () { 
	inventory.innerHTML = "";
	for (i = 0; i < showcards.length; i++) {
		inventory.innerHTML += '<button type="button" class="inventory-card">' + 
		moveToString(showcards[i]) + '</button>';
	}
	document.getElementById("inventory-showcards").style["border-style"] = "solid";
	document.getElementById("inventory-discard").style["border-style"] = "dotted";
});
document.getElementById("inventory-discard").addEventListener("click", function () { 
	inventory.innerHTML = "";
	for (i = 0; i < discard.length; i++) {
		inventory.innerHTML += '<button type="button" class="inventory-card">' + 
		moveToString(discard[i]) + '</button>';
	}
	document.getElementById("inventory-showcards").style["border-style"] = "dotted";
	document.getElementById("inventory-discard").style["border-style"] = "solid";
});
document.getElementById("inventory-back").addEventListener("click", function () {
	document.getElementById("shadow").style.display = "none";
	document.getElementById("inventory-back").style.display = "none";
	document.getElementById("inventory-showcards").style.display = "none";
	document.getElementById("inventory-discard").style.display = "none";
	inventory.style.display = "none";
	inventory.innerHTML = "";
});
function gridSquare(num) {
	return document.getElementById("grid-" + num);
}
function changeGridValue(pos, value) {
	grid[pos[1]][pos[0]] = value;
	return value;
}
function beginGame() {
	titleBox.style.animation = "appear 1s reverse both";
	health = 0;
	max = 10;
	moves = 0;
	position[0] = 0;
	position[1] = 0;
	floor = 0;
	enemy = 0;
	gamestate = 0;
	showcards.length = 0;
	turn = 0;
	shield = 0;
	poison = 0;
	enemyATK = 0;
	showcards.push([0, 2, true]);
	showcards.push([0, 2, true]);
	showcards.push([1, -1, true]);
	showcards.push([1, -1, true]);
	showcards.push([3, 3, true]);
	for (let i = 0; i < (grid.length * grid[0].length); i++) {
		gameGrid.innerHTML += '<div class="grid-none" id="grid-' + i + '"></div>';
		changeGridValue(numToPos(i), "0");
	}
	setTimeout(function () {
		updatePos();
		titleBox.style.display = "none";
		gameUI.style.display = "block";
		gameUI.style.animation = "appear 1s both";
		setTimeout(function () {
			updateBlood(10);
			updateShield(0);
		}, 1500);
		setTimeout(function () {
			gameGrid.style.animation = "appear 1s both";
			player.style.animation = "appear 1s both";
			updatePos();
			generateGrid();
			updateGrid();
		}, 2500);
	}, 1000);
}
function updateBlood(newhealth = health, newmax = max) {
	let healthCounter = health;
	let maxCounter = max;
	let loop = setInterval(function () {
		if (newhealth < healthCounter) {
			healthCounter--;
		} else if (newhealth > healthCounter) {
			healthCounter++;
		}
		if (newmax < maxCounter) {
			maxCounter--;
		} else if (newmax > maxCounter) {
			maxCounter++;
		}
		bloodNum.innerHTML = healthCounter + "<br>/<br>" + maxCounter;
		if (newhealth == healthCounter && newmax == maxCounter) {
			health = newhealth;
			max = newmax;
			clearInterval(loop);
		} 
	}, 1000 / Math.max(Math.abs(health - newhealth), Math.abs(max - newmax)));
	r.style.setProperty("--currentblood", Math.max(Math.min((health / max * 100), 100), 0) + "%");
	r.style.setProperty("--newblood", Math.max(Math.min((newhealth / newmax * 100), 100), 0) + "%");
	bloodBar.style.height = Math.max(Math.min((health / max * 100), 100), 0) + "%";
	if (bloodMove[0]) {
		bloodBar.style.animation = "bloodMove 1s both";
		bloodMove[0] = false;
	} else {
		bloodBar.style.animation = "bloodOtherMove 1s both";
		bloodMove[0] = true;
	}
	if (newhealth == 0) {
		setTimeout(revive, 1000);
	}
}
function updateEnemyBlood(newhealth = enemyHP, newmax = enemyMax, instant = false) {
	let healthCounter = enemyHP;
	let maxCounter = enemyMax;
	if (!instant) {
		let loop = setInterval(function () {
			if (newhealth < healthCounter) {
				healthCounter--;
			} else if (newhealth > healthCounter) {
				healthCounter++;
			}
			if (newmax < maxCounter) {
				maxCounter--;
			} else if (newmax > maxCounter) {
				maxCounter++;
			}
			enemyBloodNum.innerHTML = healthCounter + "<br>/<br>" + maxCounter;
			if (newhealth == healthCounter && newmax == maxCounter) {
				enemyHP = newhealth;
				enemyMax = newmax;
				clearInterval(loop);
			}
		}, 1000 / Math.max(Math.abs(enemyHP - newhealth), Math.abs(enemyMax - newmax)));
		if (bloodMove[1]) {
			enemyBloodBar.style.animation = "enemyBloodMove 1s both";
			bloodMove[1] = false;
		} else {
			enemyBloodBar.style.animation = "enemyBloodOtherMove 1s both";
			bloodMove[1] = true;
		}
	} else {
		if (bloodMove[1]) {
			enemyBloodBar.style.animation = "enemyBloodMove 0s both";
			bloodMove[1] = false;
		} else {
			enemyBloodBar.style.animation = "enemyBloodOtherMove 0s both";
			bloodMove[1] = true;
		}
	}
	r.style.setProperty("--currenteblood", Math.max(Math.min((enemyHP / enemyMax * 100), 100), 0) + "%");
	r.style.setProperty("--neweblood", Math.max(Math.min((newhealth / newmax * 100), 100), 0) + "%");
	enemyBloodBar.style.height = Math.max(Math.min((enemyHP / enemyMax * 100), 100), 0) + "%";
}
function updateShield(newhealth = shield, instant = false) {
	let healthCounter = shield;
	if (!instant) {
		let loop = setInterval(function () {
			if (newhealth < healthCounter) {
				healthCounter--;
			} else if (newhealth > healthCounter) {
				healthCounter++;
			}
			shieldNum.innerHTML = healthCounter;
			if (healthCounter == 0) {
				shieldNum.innerHTML = "";
			}
			if (newhealth == healthCounter) {
				shield = newhealth;
				clearInterval(loop);
			}
		}, 1000 / Math.abs(shield - newhealth));
		if (bloodMove[2]) {
			shieldBar.style.animation = "shieldTranslateBG 1s linear infinite, shieldMove 1s both";
			bloodMove[2] = false;
		} else {
			shieldBar.style.animation = "shieldTranslateBG 1s linear infinite, shieldOtherMove 1s both";
			bloodMove[2] = true;
		}
	} else {
		if (bloodMove[2]) {
			shieldBar.style.animation = "shieldTranslateBG 1s linear infinite, shieldMove 0s both";
			bloodMove[2] = false;
		} else {
			shieldBar.style.animation = "shieldTranslateBG 1s linear infinite, shieldOtherMove 0s both";
			bloodMove[2] = true;
		}
	}
	r.style.setProperty("--currentshield", Math.max(Math.min((shield / max * 100), 100), 0) + "%");
	r.style.setProperty("--newshield", Math.max(Math.min((newhealth / max * 100), 100), 0) + "%");
	shieldBar.style.height = Math.max(Math.min((shield / max * 100), 100), 0) + "%";
}
function updateGrid() {
	for (let i = 0; i < 72; i++) {
		let gridno = numToPos(i);
		const gridelement = gridSquare(i);
		if (grid[gridno[1]][gridno[0]] == "0") {
			gridelement.style.animation +=
			(isNaN(Number(gridelement.innerHTML)) || gridelement.innerHTML == " ") ? 
			"appear 1s reverse both" : ", appear 1s reverse both";
			setTimeout(function () {
				gridelement.className = "grid-none";
				gridelement.style.animation = "";
			}, 1000);
		} else {
			gridelement.innerHTML = grid[gridno[1]][gridno[0]];
			gridelement.className = "grid-square"; 
			if (isNaN(Number(grid[gridno[1]][gridno[0]])) || grid[gridno[1]][gridno[0]] == " ") {
				gridelement.style.animation = "";
			} else {
				gridelement.style.animation = "poison 0.5s infinite alternate";
			}
		}
	}
}
function posToNum(pos) {
	return pos[0] + (pos[1] * grid[0].length);
}
function numToPos(num) {
	return [num % grid[0].length, (num - (num % grid[0].length)) / grid[0].length];
}
function getOffset(id) {
	const element = document.getElementById(id);
	const rect = element.getBoundingClientRect();
	const gameBoxRect = gameBox.getBoundingClientRect();
	return {
		left: rect.left - gameBoxRect.left,
		top: rect.top - gameBoxRect.top
	};
}
function updatePos(dir = -1) {
	player.style.top = "calc(" + getOffset("grid-" + posToNum(position)).top + "px + 0.13em - 1px)";
	player.style.left = "calc(" + getOffset("grid-" + posToNum(position)).left + "px + 0.13em - 1px)";
	r.style.setProperty("--playerx", player.style.left);
	r.style.setProperty("--playery", player.style.top);
	gridSquare(posToNum(position)).style.border = "";
	if (dir == 0 && position[1] > 0) {
		if (isNaN(Number(grid[position[1] - 1][position[0]])) || 
		grid[position[1] - 1][position[0]] == " ") {
			position[1]--;
		} else {
			moves--;
		}
	} else if (dir == 1 && position[0] < grid[0].length - 1) {
		if (isNaN(Number(grid[position[1]][position[0] + 1])) || 
		grid[position[1]][position[0] + 1] == " ") {
			position[0]++;
		} else {
			moves--;
		}
	} else if (dir == 2 && position[1] < grid.length - 1) {
		if (isNaN(Number(grid[position[1] + 1][position[0]])) || 
		grid[position[1] + 1][position[0]] == " ") {
			position[1]++;
		} else {
			moves--;
		}
	} else if (dir == 3 && position[0] > 0) {
		if (isNaN(Number(grid[position[1]][position[0] - 1])) || 
		grid[position[1]][position[0] - 1] == " ") {
			position[0]--;
		} else {
			moves--;
		}
	}
	if (dir != -1) {
		moves++;
		r.style.setProperty("--dirx", 
			"calc(" + getOffset("grid-" + posToNum(position)).left + "px + 0.13em - 1px)");
		r.style.setProperty("--diry", 
			"calc(" + getOffset("grid-" + posToNum(position)).top + "px + 0.13em - 1px)");
		if (moves % 2 == 0) {
			player.style.animation = "playerOtherMove 0.5s both";
		} else {
			player.style.animation = "playerMove 0.5s both";
		}
	}
	gridSquare(posToNum(position)).style.border = "4px var(--borders) dotted";
}
function generateGrid() {
	for (let i = 0; i < grid.length * grid[0].length; i++) {
		grid[numToPos(i)[1]][numToPos(i)[0]] = "0";
	}
	var size = Math.floor(Math.random() * 10 + 7);
	var dir = Math.floor(Math.random() * 4);
	var curpos = [];
	curpos[0] = position[0];
	curpos[1] = position[1];
	var rooms = [];
	var dist = [];
	var rng = 0;
	var fulfill = [0, 0];
	grid[curpos[1]][curpos[0]] = " ";
	while (size > 0) {
		dir = Math.floor(Math.random() * 4);
		if (dir == 0 && curpos[1] > 0) {
			curpos[1]--;
		} else if (dir == 1 && curpos[0] < grid[0].length - 1) {
			curpos[0]++;
		} else if (dir == 2 && curpos[1] < grid.length - 1) {
			curpos[1]++;
		} else if (dir == 3 && curpos[0] > 0) {
			curpos[0]--;
		}
		if (grid[curpos[1]][curpos[0]] == "0") {
			if (size > 1) {
				rng = Math.floor(Math.random() * 20);
				if (rng <= 14 && rng > 9 && fulfill[0] < 4) {
					grid[curpos[1]][curpos[0]] = "!";
					fulfill[0]++;
				} else if (rng <= 17 && fulfill[1] < 3) {
					grid[curpos[1]][curpos[0]] = "$";
					fulfill[1]++;
				} else if (rng <= 19 && fulfill[1] < 3) {
					grid[curpos[1]][curpos[0]] = "?";
					fulfill[1]++;
				} else {
					grid[curpos[1]][curpos[0]] = " ";
				}
				rooms.push(posToNum(curpos));
			} else {
				grid[curpos[1]][curpos[0]] = "^";
			}
			size--;
		}
	}
	if (fulfill[0] == 0) {
		dist = rooms[Math.floor(Math.random() * rooms.length)];
		grid[numToPos(dist)[1]][numToPos(dist)[0]] = "!";
	}
	if (!fulfill[1] == 0) {
		dist = rooms[Math.floor(Math.random() * rooms.length)];
		grid[numToPos(dist)[1]][numToPos(dist)[0]] = "?";
	}
	floor++;
}
function gridCheck() {
	// 0 = overworld, 1 = battle, 2 = shop, 3 = event
	if (grid[position[1]][position[0]] == "!") {
		gamestate = 1;
		if (floor <= 4) {
			enemy = Math.floor(Math.random() * 1) + 1;
		} else {
			enemy = Math.floor(Math.random() * 1) + 1;
		}
		overworld.style.animation = "UIOut 2s both";
		setTimeout(battleStart, 500);
		setTimeout(function () {
			overworld.style.animation = "";
			overworld.style.transform = "translate(-30em, 0)";
		}, 2000);
	} else if (grid[position[1]][position[0]] == "$") {
		gamestate = 2;
		overworld.style.animation = "UIOut 2s both";
	} else if (grid[position[1]][position[0]] == "?") {
		gamestate = 3;
		overworld.style.animation = "UIOut 2s both";
	} else if (grid[position[1]][position[0]] == "^") {
		generateGrid();
		updateGrid();
	}
}
function battleStart() {
	battleUI.style.animation = "UIOut2 2s both";
	setTimeout(function () {
		battleUI.style.animation = "";
		battleUI.style.transform = "translate(0, 0)";
	}, 2000);
	enemyHolder.innerHTML = "";
	cards = showcards.slice();
	shuffleArray(cards);
	deck.length = 0;
	discard.length = 0;
	damage = 0;
	shield = 0;
	poison = 0;
	updateShield();
	updateBlood();
	if (enemy = 1) {
		enemyHP = 0;
		enemyMax = 10;
		enemyHolder.innerHTML = '<div id="enemy1"></div>';
		document.getElementById("enemy1").style.animation = "enemy1Idle 3s alternate infinite";
	}
	updateEnemyBlood(0, enemyMax, true);
	setTimeout(function () {
			updateEnemyBlood(enemyMax, enemyMax);
			setTimeout(draw, 300);
			setTimeout(draw, 600);
			setTimeout(draw, 900);
		}, 500);
	enemyDisplay();
}
function enemyDisplay() {
	// turn 0 is the player's first turn, turn 0.5 is the enemy's, turn 1 is the player's second, etc. 
	if (enemy == 1) {
		enemyATK = Math.ceil(turn) % 3;
		if (enemyATK == 0) {
			attackInd.innerHTML = "⍚: ○ -5";
		} else if (enemyATK == 1) {
			attackInd.innerHTML = "⍚: //";
		} else if (enemyATK == 2) {
			attackInd.innerHTML = "⍚: ○ -2";
		}
	}
}
function draw() { 
	deck.push(cards[deck.length + discard.length]);
	newCard = document.createElement("button");
	newCard.setAttribute("id", "card-" + deck.length);
	newCard.setAttribute("class", "card");
	newCard.setAttribute("type", "button");
	cardHolder.appendChild(newCard);
	newCard.style.animation = "draw 1s both";
	newCard.style.right = ((deck.length - 1) * 2) + 1.5 + "em";
	newCard.innerHTML = moveToString(deck[deck.length - 1]);
	setTimeout(function (card) {card.style.removeProperty("animation");}, 1000, newCard);
	newCard.addEventListener("click", function () {
		if (turn % 1 == 0) {
			turn += 0.25;
			var num = Number(this.id.slice(5));
			playerATK = deck[num - 1];
			this.style.animation = "useCard 1s both";
			discard.push(deck.splice(num - 1, 1)[0]);
			this.setAttribute("id", "card-using");
			cardHolder.style.animation = "cardHolderBack 1s both";
			for (let i = num + 1; i < deck.length + 2; i++) {
				const temp = document.getElementById("card-" + i);
				temp.setAttribute("id", "card-" + (i - 1));
				temp.style.animation = "shiftBack 1s both";
				setTimeout(function () {
					temp.style.right = ((i - 1) * 2) + 1.5 + "em";
				}, 1000);
			}
			setTimeout(function () {
				document.getElementById("card-using").remove();
				playerTurn();
			}, 1000);
		}
	});
}
function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = array[i];
        array[i] = array[j];
        array[j] = temp;
    }
}
function playerTurn() {
	switch (playerATK[0]) {
		default: 
			break;
		case 0: 
			if (playerATK[1] >= 0) {
				updateBlood(Math.min(health + playerATK[1], max));
			} else {
				damage = playerATK[1] - shield;
				let newshield = Math.max(0, damage * -1);
				damage = Math.max(0, damage);
				updateShield(newshield);
				updateBlood(health - damage);
				damage = 0;
			}
			break;
		case 1:
			updateBlood(health + playerATK[1]);
			break;
		case 2:
			poison += playerATK[1];
			break;
		case 3:
			updateShield(Math.min(shield + playerATK[1], max));
			break;
	}
	cardHolder.style.transform = "translate(0, 7.5em)";
	cardHolder.style.animation = "";
	setTimeout(function () {
		r.style.setProperty("--attackind", (attackInd.offsetWidth / 2) + "px");
		attackInd.style.animation = "attackInd 1s both";
		if (poison > 0) {
			updateBlood(Math.min(health + 1, max));
			poison--;
		}
	}, 1000);
	setTimeout(enemyTurn, 2000);
}
function enemyTurn() {
	turn += 0.25;
	if (enemy == 1) {
		if (enemyATK == 0) {
			damage += 5;
		} else if (enemyATK == 2) {
			damage += 2;
		}
		damage -= shield;
		let newshield = Math.max(0, damage * -1);
		damage = Math.max(0, damage);
		updateShield(newshield);
		updateBlood(health - damage);
		damage = 0;
	}
	setTimeout(function () {
		attackInd.style.animation = "attackIndBack 1s both";
		turn += 0.25;
		if (deck.length + discard.length < cards.length && deck.length < 7) {
			draw();
		} else if (deck.length == 0) {
			discard.length = 0;
			shuffleArray(cards);
			setTimeout(draw, 300);
			setTimeout(draw, 600);
			setTimeout(draw, 900);
		}
		enemyDisplay();
		cardHolder.style.animation = "cardHolderBack 1s reverse both";
		setTimeout(turnLoop, 1000);
	}, 1000);
}
function turnLoop() {
	turn += 0.25;
	cardHolder.style.animation = "";
	cardHolder.style.transform = "";
	if (enemyHP <= 0) {
		battleEnd();
	}
}
function battleEnd() {
	turn = 0;
	battleUI.style.animation = "UIOut2 2s reverse both";
	battleUI.style.transform = "";
	enemy = 0;
	updateShield(0);
	updateBlood(health, max + 2);
	grid[position[1]][position[0]] = " ";
	updateGrid();
	returnToOverworld();
}
function returnToOverworld() {
	overworld.style.animation = "UIOut 2s reverse both";
	overworld.style.transform = "";
	setTimeout(function () {
		gamestate = 0;
		battleUI.style.animation = "";
		overworld.style.animation = "";
		enemyHolder.innerHTML = "";
		for (i = 0; i < deck.length; i++) {
			document.getElementById("card-" + (i + 1)).remove();
			}
		}, 2000);
	grid[position[1]][position[0]] = " ";
	updateGrid();
}
function revive() {
	updateBlood(max);
	updateEnemyBlood(enemyHP - max);
}
function processMove(move) {
	// -1 is skip, 0 is normal, 1 is pierce, 2 is poison, 3 is shield, 4 is special
	return {sender: enemyNames.indexOf(move[0]), reciever: enemyNames.indexOf(move[2]), 
	num: parseInt(move.slice(3)), 
	type: (move[move.length - 1] == "/") ? -1 : ((move[move.length - 1] == "▻") ? 1 : 
	((move[move.length - 1] == "◌") ? 2 : ((move[move.length - 1] == "∇") ? 3 : 
	((isNaN(Number(move[move.length - 1]))) ? 4 : 0))))};
}
function moveToString(move) {
	if (move[2]) {
		return (move[0] == -1) ? "//" : 
		("○" + ((move[1] >= 0) ? " +" : " ") + move[1] + ((move[0] == 1) ? "▻" : 
		(move[0] == 2) ? "◌" : (move[0] == 3) ? "∇" : ""));
	} else {
		return (move[0] == -1) ? "//" : 
		("◈" + ((move[1] >= 0) ? " +" : " ") + move[1] + ((move[0] == 1) ? "▻" : 
		(move[0] == 2) ? "◌" : (move[0] == 3) ? "∇" : ""));
	}
}
</script>
